# SQL Server para desarrollo. Uso: SA_PASSWORD=... docker compose up -d
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: soccer-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Define SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
volumes:
  sqldata:
